<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽卡特訓班 (電容與Q=CV隨機特訓)</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: '微軟正黑體', sans-serif; 
            background-color: #1a1a2e; 
            color: #ecf0f1; display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0; overflow: hidden;
            transition: background-color 0.5s ease; 
        }
        body.rescue-mode { background-color: #4a1010; }

        .container {
            background-color: #2c3e50; width: 90%; max-width: 650px;
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center; max-height: 90vh; overflow-y: auto; position: relative;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .subtitle { color: #95a5a6; margin-bottom: 20px; font-size: 14px; }
        
        #student-setup { display: block; }
        #game-area { display: none; }
        #result-area { display: none; }

        .warning-box {
            background-color: #c0392b; color: white; padding: 12px; 
            border-radius: 8px; margin-bottom: 20px; font-weight: bold;
            font-size: 15px; line-height: 1.4; border: 2px solid #e74c3c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        input[type="text"] {
            width: 80%; padding: 15px; font-size: 18px; border-radius: 8px; 
            border: 2px solid #3498db; background: #1a1a2e; color: white; 
            text-align: center; margin-bottom: 20px;
        }

        /* 🧮 右下角懸浮計算機樣式 */
        #floating-calc-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 999;
            background: #e67e22; color: white; border: none; border-radius: 50px;
            padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.6); transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        #floating-calc-btn:hover { background: #d35400; transform: scale(1.05); }

        #calc-modal {
            position: fixed; bottom: 80px; right: 20px; z-index: 1000;
            background: #16213e; border: 2px solid #f39c12; border-radius: 12px;
            width: 250px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none; text-align: left;
        }
        .calc-header {
            display: flex; justify-content: space-between; align-items: center;
            color: #f39c12; font-weight: bold; font-size: 15px; margin-bottom: 10px;
            border-bottom: 1px solid #2c3e50; padding-bottom: 5px;
        }
        .calc-close { background: none; border: none; color: #95a5a6; font-size: 16px; cursor: pointer; }
        .calc-close:hover { color: white; }
        #calc-screen {
            width: 100%; height: 45px; background: #1a1a2e; border: 1px solid #34495e;
            color: #2ecc71; font-size: 20px; text-align: right; padding: 8px 10px;
            box-sizing: border-box; border-radius: 6px; margin-bottom: 10px; font-family: monospace;
            overflow: hidden;
        }
        .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .calc-key {
            background: #2c3e50; color: white; border: none; padding: 12px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s;
            text-align: center;
        }
        .calc-key:hover { background: #34495e; }
        .calc-key.op { background: #2980b9; }
        .calc-key.op:hover { background: #3498db; }
        .calc-key.eq { background: #27ae60; grid-column: span 2; }
        .calc-key.eq:hover { background: #219653; }
        .calc-key.clear { background: #c0392b; }
        .calc-key.clear:hover { background: #e74c3c; }

        /* 卡包選擇器 UI */
        .pack-selector-container {
            margin: 20px 0; padding: 15px; background: #16213e; border-radius: 10px;
        }
        .pack-selector-title { font-size: 16px; color: #f39c12; margin-bottom: 10px; font-weight: bold; }
        .pack-grid {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        }
        .pack-option {
            background: #2c3e50; border: 2px solid #34495e; border-radius: 8px;
            padding: 10px 15px; cursor: pointer; transition: 0.3s;
            font-size: 16px; font-weight: bold; color: #cbd5e1; flex: 1; min-width: 120px;

            box-shadow: 0 0 15px rgba(52, 152, 219, 0.6); transform: scale(1.05);
        }

            display: flex; justify-content: space-between; align-items: center;

        .inventory { font-size: 14px; color: #f1c40f; text-align: right; font-weight: bold;}
        
        .tag {

        }

        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 15px;
            font-size: 18px; cursor: pointer; border: none; border-radius: 8px;
            background-color: #34495e; color: white; font-weight: bold; transition: 0.2s; box-shadow: 0 4px #2c3e50;
        }
        .btn:hover { background-color: #3498db; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-start { background-color: #27ae60; box-shadow: 0 4px #1e8449; margin-top: 10px; }
        .btn-collection { background-color: #8e44ad; box-shadow: 0 4px #732d91; }

        #log-report { text-align: left; background: #1a1a2e; padding: 15px; border-radius: 8px; color: #f39c12; font-size: 16px; margin-bottom: 20px; max-height: 200px; overflow-y: auto;}
        
        #correct-splash {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: bold; color: #2ecc71; text-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 150;
        }
        #correct-splash.show { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }

        #gacha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; flex-direction: column; z-index: 200;
        }
        .gacha-card {
            width: 250px; height: 350px; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: white; text-align: center; padding: 20px; box-sizing: border-box; transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        .card-SP { background: linear-gradient(135deg, #ff00cc, #3333ff); box-shadow: 0 0 50px #ff00cc; border: 3px solid #fff; }
        .card-UR { background: linear-gradient(135deg, #FFD700, #FF8C00); box-shadow: 0 0 40px #FFD700; border: 3px solid #fff; }
        .card-SSR { background: linear-gradient(135deg, #ff007f, #7f00ff); box-shadow: 0 0 30px #ff007f; border: 2px solid #fff; }
        .card-SR { background: linear-gradient(135deg, #00d2ff, #3a7bd5); box-shadow: 0 0 15px #00d2ff; }
        .card-R { background: linear-gradient(135deg, #7f8c8d, #2c3e50); }
        .card-N { background: linear-gradient(135deg, #bdc3c7, #7f8c8d); color: #2c3e50; border: 1px solid #95a5a6; }
        
        .gacha-title { color: white; font-size: 24px; margin-bottom: 20px; letter-spacing: 2px;}
        .gacha-btn { margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px #c0392b; transition: 0.2s;}
        .gacha-btn-collect { background: #3498db; box-shadow: 0 4px #2980b9; }

        #collection-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: none; justify-content: flex-start; align-items: center; flex-direction: column; z-index: 300; padding-top: 30px; overflow-y: auto;
        }
        .collection-header { color: #f1c40f; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px #f39c12; }
        
        .pack-section-title { width: 90%; max-width: 800px; text-align: left; font-size: 20px; color: #34db98; margin: 20px 0 10px 0; border-bottom: 2px solid #2c3e50; padding-bottom: 5px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 90%; max-width: 800px; padding-bottom: 20px;}
        .mini-card { background: #2c3e50; border-radius: 10px; padding: 10px; text-align: center; border: 2px solid #34495e; position: relative; }
        .mini-card img { width: 100%; border-radius: 5px; margin-bottom: 10px; aspect-ratio: 1/1; object-fit: cover; }
        .mini-card .name { font-size: 14px; font-weight: bold; color: white; line-height: 1.2;}
        .mini-card .count { position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; border: 2px solid #fff; z-index: 10; }
        
        .mini-card.unowned { border-color: #555; background: #1a252f; }
        .mini-card.unowned img { filter: grayscale(100%) brightness(0.4); opacity: 0.6; }
        .mini-card.unowned .name { color: #7f8c8d; }
        
        .btn-synth { margin-top: 8px; padding: 6px 0; font-size: 13px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; animation: pulse 1.5s infinite; }
        .btn-synth:hover { background: #d35400; }
        .btn-synth-sr { background: #9b59b6; box-shadow: 0 0 10px #9b59b6; animation: pulse-sr 1.2s infinite; }
        .btn-synth-sr:hover { background: #8e44ad; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(230, 126, 34, 0); } 100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); } }
        @keyframes pulse-sr { 0% { box-shadow: 0 0 0 0 rgba(155, 89, 182, 0.8); } 70% { box-shadow: 0 0 0 10px rgba(155, 89, 182, 0); } 100% { box-shadow: 0 0 0 0 rgba(155, 89, 182, 0); } }
        
        .close-btn { margin-top: 20px; padding: 10px 30px; font-size: 18px; background: #95a5a6; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 50px;}
    </style>
</head>
<body>

    <div id="correct-splash">⭕ 正確！</div>

    <!-- 🧮 右下角懸浮計算機元件 -->
    <button id="floating-calc-btn" onclick="toggleCalculator()">🧮 計算機</button>
    <div id="calc-modal">
        <div class="calc-header">
            <span>簡易計算機</span>
            <button class="calc-close" onclick="toggleCalculator()">✕</button>
        </div>
        <div id="calc-screen">0</div>
        <div class="calc-keys">
            <button class="calc-key clear" onclick="calcClear()">C</button>
            <button class="calc-key op" onclick="calcAppend('/')">÷</button>
            <button class="calc-key op" onclick="calcAppend('*')">×</button>
            <button class="calc-key op" onclick="calcBackSpace()">⌫</button>
            
            <button class="calc-key" onclick="calcAppend('7')">7</button>
            <button class="calc-key" onclick="calcAppend('8')">8</button>
            <button class="calc-key" onclick="calcAppend('9')">9</button>
            <button class="calc-key op" onclick="calcAppend('-')">-</button>
            
            <button class="calc-key" onclick="calcAppend('4')">4</button>
            <button class="calc-key" onclick="calcAppend('5')">5</button>
            <button class="calc-key" onclick="calcAppend('6')">6</button>
            <button class="calc-key op" onclick="calcAppend('+')">+</button>
            
            <button class="calc-key" onclick="calcAppend('1')">1</button>
            <button class="calc-key" onclick="calcAppend('2')">2</button>
            <button class="calc-key" onclick="calcAppend('3')">3</button>
            <button class="calc-key eq" onclick="calcEvaluate()">=</button>
            
            <button class="calc-key" onclick="calcAppend('0')" style="grid-column: span 2;">0</button>
            <button class="calc-key" onclick="calcAppend('.')">.</button>
        </div>
    </div>

    <div id="gacha-overlay">
        <div class="gacha-title" id="gacha-title">✨ 連擊達成！獲得抽卡機會！ ✨</div>
        <button class="gacha-btn" id="pre-draw-btn" onclick="executeDraw()">👉 點擊抽卡 👈</button>
        <div class="gacha-card" id="revealed-card" style="display:none;">
            <img id="card-image" src="" style="width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; display: none;">
            <div id="card-name" style="font-size: 20px; line-height: 1.2;">卡片名稱</div>
        </div>
        <button class="gacha-btn gacha-btn-collect" id="post-draw-btn" onclick="closeGacha()" style="display:none;">收下神卡並繼續</button>
    </div>

    <div id="collection-modal">
        <div class="collection-header" id="collection-title">🏆 專屬集卡冊</div>
        <div id="collection-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        </div>
        <button class="close-btn" onclick="closeCollection()">返回首頁</button>
    </div>

    <div class="container">
        <div id="student-setup">
            <h1>⚡ 電容與Q=CV隨機特訓班 ⚡</h1>
            <div class="subtitle">連續答對 2 題即可抽卡！(共 10 題隨機題庫)</div>
            
            <div class="warning-box">
                ⚠️ 注意：請先輸入姓名並點擊【☁️ 1. 載入雲端圖鑑存檔】，再開始挑戰！否則辛苦抽到的卡片紀錄會被洗掉喔！
            </div>

            <input type="text" id="student-name" placeholder="請輸入 班級+座號+姓名">
            
            <div class="pack-selector-container">
                <div class="pack-selector-title">👇 請選擇本次測驗的專屬抽卡包 👇</div>
                <div class="pack-grid" id="pack-selector"></div>
            </div>
            
            <button class="btn" id="btn-sync" style="background-color: #2980b9; box-shadow: 0 4px #1c5980;" onclick="syncCloudData()">☁️ 1. 載入雲端圖鑑存檔</button>
            <button class="btn btn-start" onclick="startGame()">▶️ 2. 開始大挑戰</button>
            <button class="btn btn-collection" onclick="openCollection()">📖 查看我的圖鑑進度</button>
        </div>

        <div id="game-area">
            <div class="status-bar">
                <div class="hp-bar" id="hp-display">
                    <span id="hearts">❤️❤️❤️</span>
                    <span class="streak-badge" id="streak-display">🔥 連擊: 0 / 2</span>
                </div>
                <div class="inventory" id="inventory-display">🎒 本局卡簿: 空</div>
            </div>
            <div class="tag" id="q-tag">標籤</div>
            <div class="question-text" id="q-text">題目載入中...</div>
            <div id="options-area"></div>
        </div>

        <div id="result-area">
            <h1>測驗完成！🎉</h1>
            <p>戰利品已自動存入集卡冊，診斷報告已傳送給老師。</p>
            <div id="log-report"></div>
            <button class="btn btn-collection" style="margin-top:20px;" onclick="location.reload()">返回首頁查看集卡冊</button>
        </div>
    </div>

    <script>
        // === 🧮 右下角計算機邏輯 ===
        let calcDisplayValue = "0";
        let calcJustEvaluated = false;

        function toggleCalculator() {
            const modal = document.getElementById('calc-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        function updateCalcScreen() {
            const screen = document.getElementById('calc-screen');
            screen.innerText = calcDisplayValue;
        }

        function calcClear() {
            calcDisplayValue = "0";
            calcJustEvaluated = false;
            updateCalcScreen();
        }

        function calcBackSpace() {
            if (calcJustEvaluated) {
                calcClear();
                return;
            }
            calcDisplayValue = calcDisplayValue.length > 1 ? calcDisplayValue.slice(0, -1) : "0";
            updateCalcScreen();
        }

        function calcAppend(char) {
            if (calcJustEvaluated && !isNaN(char)) {
                calcDisplayValue = char;
                calcJustEvaluated = false;
            } else {
                if (calcDisplayValue === "0" && char !== '.') {
                    calcDisplayValue = char;
                } else {
                    calcDisplayValue += char;
                }
                calcJustEvaluated = false;
            }
            updateCalcScreen();
        }

        function calcEvaluate() {
            try {
                let expression = calcDisplayValue.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(expression);
                if (!isFinite(result)) {
                    calcDisplayValue = "錯誤";
                } else {
                    calcDisplayValue = String(Number(result.toFixed(2)));
                }
                calcJustEvaluated = true;
            } catch (error) {
                calcDisplayValue = "錯誤";
                calcJustEvaluated = true;
            }
            updateCalcScreen();
        }

        // === 音效引擎 ===
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }
        function playSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'draw') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'synth') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); 
                osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.6);
                gain.gain.setValueAtTime(0.4, now); osc.start(now); osc.stop(now + 0.7);
            }
        }

        // ==========================================
        // 📦 卡包資料設定
        // ==========================================
        const cardPacks = {
            "phase1": {
                name: "⚡ 第一階段",
                cards: [
                    { id: "c_sp1", name: "【SP】超古代覺醒・裂空座", rarity: "SP", chance: 0, image: "images/SP1.jpg" },
                    { id: "c1", name: "【UR】暗黑・洛奇亞", rarity: "UR", chance: 0.375, image: "images/UR1.jpg" },
                    { id: "c2", name: "【UR】光明・洛奇亞", rarity: "UR", chance: 0.375, image: "images/UR2.jpg" },
                    { id: "c3", name: "【UR】光明・鳳王", rarity: "UR", chance: 0.375, image: "images/UR3.jpg" },
                    { id: "c4", name: "【UR】對戰・鳳王", rarity: "UR", chance: 0.375, image: "images/UR4.jpg" },
                    { id: "c5", name: "【UR】期間限定・Twice", rarity: "UR", chance: 0.375, image: "images/UR5.png" },
                    { id: "c6", name: "【UR】籃球之神・喬丹", rarity: "UR", chance: 0.375, image: "images/MJ_UR.png" },
                    { id: "c31", name: "【UR】期間限定・子瑜", rarity: "UR", chance: 0.375, image: "images/UR6.png" },
                    { id: "c32", name: "【UR】期間限定・娜璉", rarity: "UR", chance: 0.375, image: "images/UR7.png" },
                    { id: "c7", name: "【SSR】全圖洛奇亞", rarity: "SSR", chance: 1.5, image: "images/SSR1.jpg" },
                    { id: "c8", name: "【SSR】異色洛奇亞", rarity: "SSR", chance: 1.5, image: "images/SSR2.jpg" },
                    { id: "c9", name: "【SSR】浮雕洛奇亞", rarity: "SSR", chance: 1.5, image: "images/SSR3.jpg" },
                    { id: "c10", name: "【SSR】全圖鳳王", rarity: "SSR", chance: 1.5, image: "images/SSR4.jpg" },

        function initPackSelector() {
            const selector = document.getElementById('pack-selector');
            if (!selector) return;
            selector.innerHTML = '';
            
            Object.keys(cardPacks).forEach(key => {
                if (cardPacks[key] && cardPacks[key].cards) {
                    const div = document.createElement('div');
                    div.className = `pack-option ${key === currentPackId ? 'active' : ''}`;
                    div.innerText = cardPacks[key].name;
                    div.onclick = function() {
                        selectPack(key, this);
                    };
                    selector.appendChild(div);
                }
            });
        }

        function selectPack(packId, el) {
            currentPackId = packId;
            document.querySelectorAll('.pack-option').forEach(opt => opt.classList.remove('active'));

        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function saveToCollection(cardObj) {
            let storageKey = "gachaCollection_" + studentName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];
            let existingCard = pastCollection.find(c => c.id === cardObj.id);
            if(existingCard) { existingCard.count += 1; } 
            else { pastCollection.push({ ...cardObj, count: 1 }); }
            localStorage.setItem(storageKey, JSON.stringify(pastCollection));
        }

        function openCollection() {
            let inputName = document.getElementById('student-name').value.replace(/\s+/g, '');
            if(!inputName) { alert("請先輸入姓名！"); return; }
            
            let storageKey = "gachaCollection_" + inputName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            let totalUnique = 0;
            let totalCards = 0;
            
            let contentArea = document.getElementById('collection-content');
            contentArea.innerHTML = "";
            
            Object.keys(cardPacks).forEach(packKey => {
                const pack = cardPacks[packKey];
                let packNormalPool = pack.cards.filter(c => c.chance > 0);
                if (packNormalPool.length === 0) return;

                totalCards += packNormalPool.length;
                let packUnique = packNormalPool.filter(mc => pastCollection.some(pc => pc.id === mc.id)).length;
                totalUnique += packUnique;
                
                contentArea.innerHTML += `<div class="pack-section-title">${pack.name} (${packUnique}/${packNormalPool.length})</div>`;
                
                let gridHtml = `<div class="card-grid">`;
                pack.cards.forEach(masterCard => {
                    let ownedCard = pastCollection.find(c => c.id === masterCard.id);
                    if (ownedCard) {
                        let synthHtml = "";
                        if (masterCard.synthTarget && ownedCard.count >= 5) {
                            let btnClass = masterCard.rarity === "SR" ? "btn-synth btn-synth-sr" : "btn-synth";
                            let btnIcon = masterCard.rarity === "SR" ? "🔥" : "✨";
                            synthHtml = `<button class="${btnClass}" onclick="synthesizeCard('${masterCard.id}', '${masterCard.synthTarget}')">${btnIcon} 5合1 覺醒</button>`;
                        }

                        gridHtml += `
                            <div class="mini-card">
                                <div class="count">x${ownedCard.count}</div>
                                <img src="${masterCard.image}" alt="${masterCard.name}">
                                <div class="name">${masterCard.name}</div>
                                ${synthHtml}
                            </div>`;
                    } else {
                        gridHtml += `
                            <div class="mini-card unowned">
                                <div style="width: 100%; aspect-ratio: 1/1; background: #1a1a2e; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; color: #7f8c8d; font-size: 32px; font-weight: bold; border: 1px dashed #34495e;">?</div>

                    }
                });
                gridHtml += `</div>`;
                contentArea.innerHTML += gridHtml;
            });

            document.getElementById('collection-modal').style.display = "flex";
        }

        function synthesizeCard(materialId, targetSpId) {
            let inputName = document.getElementById('student-name').value.replace(/\s+/g, '');
            let storageKey = "gachaCollection_" + inputName;
            let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];

            let materialIndex = pastCollection.findIndex(c => c.id === materialId);
            if (materialIndex > -1 && pastCollection[materialIndex].count >= 5) {
                let spMaster = null;
                for (let packKey in cardPacks) {
                    let found = cardPacks[packKey].cards.find(c => c.id === targetSpId);
                    if (found) { spMaster = found; break; }
                }
                if (!spMaster) return;

                if (spMaster.pblTask && spMaster.unlockCode) {
                    let userInput = prompt(`🛑 傳說覺醒任務觸發！🛑\n\n${spMaster.pblTask}\n\n(任務完成後，請向老師索取通關密碼，並輸入於下方：)`);
                    if (userInput === null) return; 
                    else if (userInput.trim() !== spMaster.unlockCode) {
                        alert("❌ 密碼錯誤！請確認你已經確實完成任務，並向老師取得正確密碼！");
                        playSound('wrong');
                        return; 
                    }
                }

                pastCollection[materialIndex].count -= 5;
                let spCardIndex = pastCollection.findIndex(c => c.id === targetSpId);
                if (spCardIndex > -1) { pastCollection[spCardIndex].count += 1; } 
                else { pastCollection.push({ ...spMaster, count: 1 }); }
                
                localStorage.setItem(storageKey, JSON.stringify(pastCollection));
                closeCollection();
                showSynthesisAnimation(spMaster);
            }
        }

                setTimeout(() => {
                    overlay.style.display = "none";
                    postBtn.innerText = "收下神卡並繼續";
                    postBtn.onclick = closeGacha; 
                    openCollection(); 
                }, 300);
            };
            overlay.style.display = "flex";
            setTimeout(() => { cardObj.style.transform = "scale(1)"; }, 100);
        }

        function closeCollection() { document.getElementById('collection-modal').style.display = "none"; }

        function startGame() {
            studentName = document.getElementById('student-name').value.replace(/\s+/g, '');
            if (!studentName) { alert("請先輸入姓名喔！"); return; }
            
            generateRandomParallelQuiz();
            currentStep = "q1";
            hp = 30;
            currentStreak = 0;
            diagnosticLogs = [];
            sessionCards = [];
            failedQuestions = [];
            rescueTriggered = 0;
            rescueFails = 0;
            aiCopyCount = 0;

            startTime = Date.now();
            initAudio(); 
            document.getElementById('student-setup').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            updateStatus();
            renderQuestion();
        }

        function renderQuestion() {
            isTransitioning = false; 
            if (currentStep === "end" || !quizData[currentStep]) {
                finishGame();
                return;
            }

            const q = quizData[currentStep];
            if(!q) { finishGame(); return; }

            document.getElementById('q-tag').innerText = q.tag;
            document.getElementById('q-text').innerHTML = q.text;

            if (q.tag.includes("救援") || q.tag.includes("提示")) {
                document.getElementById('q-tag').style.background = "#8e44ad"; 
                document.body.classList.add('rescue-mode'); 
            } else {
                document.body.classList.remove('rescue-mode'); 
                document.getElementById('q-tag').style.background = "#e74c3c"; 
            }

            const oldAiBox = document.getElementById('ai-assistant-box');
            if (oldAiBox) oldAiBox.remove();

            if (q.aiPrompt) {
                const aiBox = document.createElement('div');
                aiBox.id = 'ai-assistant-box';
                aiBox.style = "background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #3498db; text-align: left;";
                
                let safeUrl = q.aiUrl || "https://gemini.google.com/";
                
                aiBox.innerHTML = `
                    <div style="color: #3498db; font-weight: bold; font-size: 14px; margin-bottom: 8px;">🤖 AI 戰術教練線上應援：</div>
                    <div style="font-size: 13px; color: #cbd5e1; background: #1a1a2e; padding: 10px; border-radius: 5px; max-height: 80px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #2c3e50;">${q.aiPrompt}</div>
                    <button class="btn" style="background: #e67e22; box-shadow: 0 4px #b35d10; padding: 10px; font-size: 15px; margin-bottom: 0;" id="ai-action-btn">
                        📋 複製戰術秘笈並向 Gemini 請教外掛
                    </button>
                    <div id="ai-timer-msg" style="color: #e74c3c; font-size: 13px; font-weight: bold; margin-top: 8px; text-align: center; display: none;"></div>
                `;
                document.getElementById('game-area').insertBefore(aiBox, document.getElementById('options-area'));

                aiBox.querySelector('#ai-action-btn').addEventListener('click', function(e) {
                    if (this.classList.contains('is-active')) return;
                    this.classList.add('is-active');

                    handleAiAssist(q.aiPrompt, safeUrl);

                    const optionsArea = document.getElementById('options-area');
                    const originalButtons = optionsArea.querySelectorAll('button');
                    originalButtons.forEach(b => b.disabled = true);
                    
                    this.disabled = true;
                    this.style.background = "#7f8c8d";
                    this.style.boxShadow = "none";

                    let timeLeft = 30;
                    const timerMsg = document.getElementById('ai-timer-msg');
                    timerMsg.style.display = "block";

                    const countdown = setInterval(() => {
                        timerMsg.innerText = `🚨 AI 教練正在傳授破解戰術... 請研讀上方提示，${timeLeft} 秒後解鎖作答按鈕！`;
                        timeLeft--;

                        if (timeLeft < 0) {
                            clearInterval(countdown);
                            timerMsg.style.color = "#2ecc71";
                            timerMsg.innerText = "✅ 戰術解讀完成！作答通道已解鎖！";
                            originalButtons.forEach(b => b.disabled = false);
                            aiCopyCount++; 
                        }
                    }, 1000);
                });
            }

            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = ""; 

            let shuffledOptions = [...q.options];
            shuffleArray(shuffledOptions);
            const labels = ["A", "B", "C", "D"];

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                let cleanText = opt.text.replace(/^[A-D]\.\s*/, "");
                btn.innerHTML = `${labels[index]}. ${cleanText}`;
                btn.onclick = () => handleAnswer(opt);
                optionsArea.appendChild(btn);
            });

            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('game-area')]).catch((err) => console.log(err.message));
            }
        }

        function handleAnswer(selectedOption) {
            if (isTransitioning) return; 
            isTransitioning = true; 
            let isRescueQuestion = currentStep.includes("_help"); 

            if (!selectedOption.isCorrect) {
                playSound('wrong'); 
                
                let storageKey = "gachaCollection_" + studentName;
                let pastCollection = JSON.parse(localStorage.getItem(storageKey)) || [];
                let aiShieldIndex = pastCollection.findIndex(c => c.id === "p2_ai" && c.count > 0);

                if (aiShieldIndex > -1) {
                    pastCollection[aiShieldIndex].count--;
                    localStorage.setItem(storageKey, JSON.stringify(pastCollection));
                    alert("🛡️ 戰術護盾觸發！消耗 1 張【AI 戰術教練卡】，本次答錯免扣血（HP 保留）！");
                    
                    let totalOwned = pastCollection.reduce((sum, c) => sum + c.count, 0);
                    document.getElementById('inventory-display').innerText = `🎒 本局卡簿: ${totalOwned} 張`;
                } else {
                    hp--; 
                    if(hp < 0) hp = 0; 
                }

                currentStreak = 0; 
                updateStatus();
                if (selectedOption.log) diagnosticLogs.push(selectedOption.log);
                
                if (!failedQuestions.includes(currentStep)) {
                    failedQuestions.push(currentStep);
                }

                if (!isRescueQuestion) { rescueTriggered++; } 
                else { rescueFails++; }

                currentStep = selectedOption.next;
                renderQuestion();
            } else {
                playSound('correct'); 
                showCorrectSplash();  
                
                if (!isRescueQuestion && !failedQuestions.includes(currentStep)) {
                    currentStreak++;
                }

                setTimeout(() => {
                    let nextStep = selectedOption.next;
                    
                    if (currentStreak >= 2) {
                        currentStreak = 0;
                        currentStep = nextStep; 
                        prepareGacha(); 
                    } else {
                        currentStep = nextStep; 
                        if (currentStep === "end") {
                            finishGame();
                        } else {
                            renderQuestion();
                        }
                    }
                    updateStatus();
                }, 800);
            }
        }

        function showCorrectSplash() {
            const splash = document.getElementById('correct-splash');
            splash.classList.add('show');
            setTimeout(() => { splash.classList.remove('show'); }, 600);
        }

        function updateStatus() {
            let hpText = hp > 10 ? `❤️ x ${hp}` : "❤️".repeat(hp);
            document.getElementById('hearts').innerText = hpText;
            document.getElementById('streak-display').innerText = `🔥 連擊: ${currentStreak} / 2`;
        }

        function prepareGacha() {
            const overlay = document.getElementById('gacha-overlay');
            document.getElementById('pre-draw-btn').style.display = 'block';
            document.getElementById('revealed-card').style.display = 'none';
            document.getElementById('post-draw-btn').style.display = 'none';
            overlay.style.display = "flex";
        }

        function executeDraw() {
            playSound('draw'); 
            document.getElementById('pre-draw-btn').style.display = 'none';
            document.getElementById('gacha-title').innerText = "🎉 戰利品揭曉 🎉";
            drawCard(); 
        }

        function drawCard() {
            const cardObj = document.getElementById('revealed-card');
            
            if (!cardPacks[currentPackId] || cardPacks[currentPackId].cards.length === 0) {
                currentPackId = "phase1";
            }
            
            let currentPool = cardPacks[currentPackId].cards;
            let drawablePool = currentPool.filter(c => c.chance > 0);
            
            let randomNum = Math.random() * 100;
            let currentLimit = 0;
            let resultCard = drawablePool[drawablePool.length - 1]; 
            for (let i = 0; i < drawablePool.length; i++) {
                currentLimit += drawablePool[i].chance;
                if (randomNum <= currentLimit) { resultCard = drawablePool[i]; break; }
            }

            cardObj.className = "gacha-card"; 
            cardObj.classList.add(`card-${resultCard.rarity}`);
            document.getElementById('card-image').src = resultCard.image; 
            document.getElementById('card-image').style.display = 'block'; 
            document.getElementById('card-name').innerText = resultCard.name;
            
            cardObj.style.display = 'flex';
            document.getElementById('post-draw-btn').style.display = 'block';
            setTimeout(() => { cardObj.style.transform = "scale(1)"; }, 100);

            sessionCards.push(resultCard.name);
            saveToCollection(resultCard); 
            document.getElementById('inventory-display').innerText = `🎒 本局已抽: ${sessionCards.length} 張`;
        }

        function closeGacha() {
            const overlay = document.getElementById('gacha-overlay');
            const cardObj = document.getElementById('revealed-card');
            cardObj.style.transform = "scale(0)"; 
            setTimeout(() => {
                overlay.style.display = "none";
                renderQuestion(); 
            }, 300);
        }

        function finishGame() {
            let storageKey = "gachaCollection_" + studentName;
            let currentCollection = JSON.parse(localStorage.getItem(storageKey)) || [];

            if (hp === 30 && failedQuestions.length === 0) {
                let godCardMaster = null;
                for (let key in cardPacks) {
                    let found = cardPacks[key].cards.find(c => c.id === "c_sp1");
                    if (found) { godCardMaster = found; break; }
                }
                
                if (godCardMaster) {
                    let existingGodCard = currentCollection.find(c => c.id === "c_sp1");
                    if (existingGodCard) {
                        existingGodCard.count += 1;
                        alert("🏆 完美通關！【SP】神卡數量已累積 +1！");
                    } else {
                        currentCollection.push({ ...godCardMaster, count: 1 });
                        alert("🏆 恭喜你達成完美零誤差通關！專屬隱藏神卡已存入你的圖鑑！");
                    }
                }
            }

            localStorage.setItem(storageKey, JSON.stringify(currentCollection));
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';

            totalTime = Math.round((Date.now() - startTime) / 1000);

            let reportArea = document.getElementById('log-report');
            let logText = diagnosticLogs.length === 0 ? "🌟 完美通關，電容與Q=CV計算概念極度扎實！" : "⚠️ 盲點診斷 (請老師留意)：\n" + diagnosticLogs.join("\n");
            
            let finalScoreText = `血量剩餘：${hp}\n🕒 耗時：${totalTime} 秒\n🏀 本局共獲得 ${sessionCards.length} 張卡片\n\n`;
            reportArea.innerText = finalScoreText + logText;

            let itemsText = sessionCards.length > 0 ? sessionCards.join(",") : "無";

            sendDataToSheet(
                studentName, 
                hp, 
                totalTime, 
                rescueTriggered, 
                rescueFails, 
                diagnosticLogs.length, 
                diagnosticLogs.join(" | "), 
                itemsText,
                "電容與Q=CV隨機特訓"
            );
        }
        
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx7SKmU6_97ZH5HHtB1GObxSaoGTdLPpHtvdW9jLYHMNKu9uwd9ubLQ5Mf6BUuJQNwIhA/exec';
        
        function sendDataToSheet(name, hp, time, rescueT, rescueF, errorCount, errorDetails, cards, unitName) {
            if(!scriptURL) return;
            let formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('hp', hp);
            formData.append('time', time);
            formData.append('rescueTriggered', rescueT);
            formData.append('rescueFails', rescueF); 
            formData.append('errorCount', errorCount);
            formData.append('errorDetails', errorDetails);
            formData.append('cards', cards);
            formData.append('unitName', unitName);
            
            let storageKey = "gachaCollection_" + name;
            let fullCollection = localStorage.getItem(storageKey) || "[]";
            formData.append('fullCollection', fullCollection);
            
            fetch(scriptURL, { method: 'POST', body: formData }).catch(e=>console.log(e));
        }

        async function syncCloudData() {
            let inputName = document.getElementById('student-name').value.replace(/\s+/g, '');
            if(!inputName) { alert("⚠️ 請先輸入您的姓名，才能尋找雲端存檔喔！"); return; }
            if(!scriptURL) { alert("⚠️ 尚未設定 Google Sheet 網址，無法同步！"); return; }

            let syncBtn = document.getElementById('btn-sync');
            let originalText = syncBtn.innerText;
            syncBtn.innerText = "⏳ 雲端同步中，請稍候...";
            syncBtn.disabled = true;

            try {
                let fetchUrl = scriptURL + "?name=" + encodeURIComponent(inputName) + "&t=" + new Date().getTime();
                let response = await fetch(fetchUrl, { method: "GET" });
                let result = await response.json();

                if(result.status === "success") {
                    let cloudDataRaw = result.data;
                    let cloudData = [];
                    if (typeof cloudDataRaw === 'string') {
                        cloudData = JSON.parse(cloudDataRaw);
                    } else {
                        cloudData = cloudDataRaw;
                    }
                    
                    let storageKey = "gachaCollection_" + inputName;
                    let localData = JSON.parse(localStorage.getItem(storageKey)) || [];

                    cloudData.forEach(cloudCard => {
                        let existing = localData.find(c => c.id === cloudCard.id);
                        if (existing) {
                            existing.count = Math.max(existing.count, cloudCard.count); 
                        } else {
                            localData.push(cloudCard);
                        }
                    });

                    localStorage.setItem(storageKey, JSON.stringify(localData));
                    alert("✅ 雲端同步成功！已為您載入最新圖鑑進度！\n(系統已自動比對並保留您的最高進度)");
                } else {
                    alert("🆕 找不到您的雲端存檔。\n如果您是第一次玩，這是正常的，系統將為您建立全新圖鑑！");
                }
            } catch(e) {
                alert("❌ 同步失敗，請檢查網路連線或稍後再試。");
                console.error(e);
            } finally {
                syncBtn.innerText = originalText;
                syncBtn.disabled = false;
            }
        }

        function handleAiAssist(promptText, targetUrl) {
            alert("📋 AI 提詞複製成功！\n接下來會自動開啟 Gemini，請直接在對話框「貼上 (Ctrl+V)」送出即可！");
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(promptText).then(() => {
                    window.open(targetUrl, '_blank');
                }).catch(err => {
                    window.open(targetUrl, '_blank');
                });
            } else {
                window.open(targetUrl, '_blank');
            }
        }
    </script>
</body>
